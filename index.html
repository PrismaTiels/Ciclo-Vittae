<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciclo Vittae - Despertar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #fcfaf5;
            --sky-mid: #f7f1e4;
            --sky-bot: #eee3ca;
            --gold: #c2a163;
            --gold-light: #dcc189;
            --gold-dark: #8a6f3c;
            --text-main: #3d3425;
            --text-mid: #7a6b52;
            --text-soft: #b3a48c;
            --card-bg: rgba(255, 254, 249, 0.72);
            --card-border: rgba(184, 148, 90, 0.22);
            --input-bg: rgba(255, 255, 255, 0.75);
            --input-bg-focus: rgba(255, 255, 255, 0.95);
            --divider-bg: rgba(255, 254, 249, 0.9);
            --btn-text: #fffdf6;
            --rays-color: rgba(255, 250, 235, 0.5);
            --sun-core: rgba(255, 253, 245, 0.85);
            --sun-mid: rgba(255, 250, 235, 0.4);
            --sun-edge: rgba(250, 240, 215, 0.12);
            --vignette: rgba(120, 95, 55, 0.06);
        }
        body.dark {
            --sky-top: #16121f;
            --sky-mid: #0c0914;
            --sky-bot: #040308;
            --gold: #c4a56a;
            --gold-light: #e0c88a;
            --gold-dark: #d9b979;
            --text-main: #e8e2d5;
            --text-mid: #b0a893;
            --text-soft: #6a6255;
            --card-bg: rgba(20, 16, 30, 0.7);
            --card-border: rgba(196, 165, 106, 0.28);
            --input-bg: rgba(10, 8, 16, 0.7);
            --input-bg-focus: rgba(10, 8, 16, 0.92);
            --divider-bg: rgba(20, 16, 30, 0.9);
            --btn-text: #1a1524;
            --rays-color: rgba(150, 130, 210, 0.12);
            --sun-core: rgba(170, 155, 215, 0.4);
            --sun-mid: rgba(140, 120, 195, 0.18);
            --sun-edge: rgba(120, 100, 175, 0.05);
            --vignette: rgba(0, 0, 0, 0.35);
        }
        * { box-sizing: border-box; }
        html { height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: var(--sky-mid);
            position: relative;
            transition: background-color 0.6s ease, color 0.4s ease;
        }
        .sky-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
            transition: opacity 0.8s ease;
        }
        .sky-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-mid) 55%, var(--sky-bot) 100%);
        }
        .sun-glow {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 80% 70% at 50% 0%, var(--sun-core) 0%, var(--sun-mid) 30%, var(--sun-edge) 60%, transparent 90%);
            animation: sunPulse 10s ease-in-out infinite alternate;
        }
        @keyframes sunPulse { from { opacity: 0.85; } to { opacity: 1; } }
        .god-rays {
            position: absolute; top: -50vh; left: -30vw;
            width: 160vw; height: 200vh;
            background: conic-gradient(from 165deg at 50% 25%,
                transparent 0deg, var(--rays-color) 12deg, transparent 24deg,
                transparent 40deg, var(--rays-color) 52deg, transparent 64deg,
                transparent 82deg, var(--rays-color) 94deg, transparent 106deg);
            filter: blur(40px);
            animation: raysBreathe 14s ease-in-out infinite alternate;
        }
        @keyframes raysBreathe { from { opacity: 0.7; } to { opacity: 1; } }
        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 90% 85% at center, transparent 50%, var(--vignette) 100%);
        }
        .theme-toggle {
            position: fixed; top: 22px; right: 22px; z-index: 10001;
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--gold-dark); font-size: 17px; cursor: pointer;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }
        .theme-toggle:hover { transform: scale(1.08); border-color: var(--gold); }
        .login-wrapper {
            position: relative; z-index: 5;
            width: 100%; max-width: 440px;
            transition: opacity 0.6s ease, filter 0.6s ease, transform 0.6s ease;
        }
        .login-wrapper.fading { opacity: 0; filter: blur(20px); transform: scale(0.9); pointer-events: none; }
        .glass-card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 32px 30px 30px;
            width: 100%; text-align: center;
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            box-shadow: 0 30px 60px -20px rgba(138, 111, 60, 0.18),
                        0 0 0 1px rgba(255, 255, 255, 0.15) inset,
                        0 1px 0 rgba(255, 255, 255, 0.2) inset;
            animation: cardEnter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .card-title {
            font-family: 'Cinzel', serif; font-weight: 500; font-size: 24px;
            letter-spacing: 0.3em; text-transform: uppercase;
            color: var(--gold-dark); margin: 0 0 4px 0; text-indent: 0.3em;
        }
        .card-subtitle {
            font-family: 'Cormorant Garamond', serif; font-style: italic;
            font-size: 16px; color: var(--text-mid); margin-bottom: 22px; display: block;
        }
        .halo-divider {
            width: 80px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 20px; opacity: 0.6; position: relative;
        }
        .halo-divider::after {
            content: '✦'; position: absolute; top: -8px; left: 50%;
            transform: translateX(-50%); background: var(--divider-bg);
            padding: 0 6px; color: var(--gold); font-size: 10px;
        }
        .tab-switcher {
            display: flex; gap: 6px; margin-bottom: 22px;
            background: rgba(0,0,0,0.04); padding: 4px; border-radius: 12px;
            border: 1px solid var(--card-border);
        }
        body.dark .tab-switcher { background: rgba(0,0,0,0.3); }
        .tab-switcher button {
            flex: 1; padding: 10px 8px; border-radius: 9px;
            background: transparent; border: none; cursor: pointer;
            font-family: 'Cinzel', serif; font-weight: 700;
            font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--text-mid); transition: all 0.25s;
        }
        .tab-switcher button.active {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 100%);
            color: var(--btn-text); box-shadow: 0 4px 12px -4px rgba(138,111,60,0.4);
        }
        .input-group { text-align: left; margin-bottom: 14px; }
        .input-group label {
            display: block; font-size: 9px; text-transform: uppercase;
            font-weight: 700; letter-spacing: 0.22em;
            color: var(--gold-dark); margin-bottom: 6px; opacity: 0.9;
        }
        input, select {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 13px 16px;
            width: 100%; color: var(--text-main); outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px; font-family: 'Inter', sans-serif;
        }
        input::placeholder {
            color: var(--text-soft); font-style: italic;
            font-family: 'Cormorant Garamond', serif; font-size: 15px;
        }
        input:focus {
            border-color: var(--gold); background: var(--input-bg-focus);
            box-shadow: 0 0 0 4px rgba(201, 169, 97, 0.12), 0 4px 14px rgba(184, 148, 90, 0.08);
        }
        input.erro { border-color: #c9756a !important; animation: shake 0.4s ease; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .btn-entrar {
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 60%, var(--gold-dark) 100%);
            color: var(--btn-text); font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.22em; font-size: 12px; width: 100%;
            padding: 16px; border-radius: 12px; margin-top: 10px;
            cursor: pointer; border: none; font-family: 'Cinzel', serif;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 20px -8px rgba(138, 111, 60, 0.5);
        }
        .btn-entrar:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(138, 111, 60, 0.6);
            filter: brightness(1.05);
        }
        .btn-entrar:disabled { opacity: 0.6; cursor: wait; letter-spacing: 0.15em; }
        .btn-link {
            background: none; border: none; color: var(--gold-dark);
            font-size: 11px; font-style: italic; cursor: pointer;
            font-family: 'Cormorant Garamond', serif;
            margin-top: 12px; text-decoration: underline;
            text-underline-offset: 3px; opacity: 0.8;
        }
        .btn-link:hover { opacity: 1; }
        .status-msg {
            font-size: 11px; text-align: center; margin-top: 14px;
            min-height: 16px; color: var(--text-soft);
            font-style: italic; font-family: 'Cormorant Garamond', serif;
        }
        .status-msg.erro { color: #b85a4a; }
        .status-msg.sucesso { color: #7a8f5c; }
        body.dark .status-msg.erro { color: #e08076; }
        body.dark .status-msg.sucesso { color: #9bb87a; }
        .hidden { display: none !important; }
        @media (max-width: 420px) {
            .glass-card { padding: 26px 18px 24px; }
            .card-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="sky-bg">
        <div class="sky-gradient"></div>
        <div class="god-rays"></div>
        <div class="sun-glow"></div>
        <div class="vignette"></div>
    </div>

    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">🌙</span>
    </button>

    <div class="login-wrapper" id="login-wrapper">
        <div class="glass-card">
            <h1 class="card-title">Ciclo</h1>
            <span class="card-subtitle">o pós vida lhe aguarda</span>
            <div class="halo-divider"></div>

            <div class="tab-switcher">
                <button id="tab-jogador" class="active" onclick="setTab('jogador')">Jogador</button>
                <button id="tab-mestre" onclick="setTab('mestre')">Mestre</button>
            </div>

            <!-- ========== PAINEL JOGADOR ========== -->
            <div id="panel-jogador">
                <div id="subtabs-jogador" class="tab-switcher" style="margin-bottom:16px;">
                    <button id="sub-entrar" class="active" onclick="setSubTab('entrar')">Entrar</button>
                    <button id="sub-criar" onclick="setSubTab('criar')">Criar Conta</button>
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="j-email" placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="j-senha" placeholder="••••••••" autocomplete="current-password">
                </div>

                <div id="campo-campanha" class="input-group">
                    <label>Código da Campanha</label>
                    <input type="text" id="j-campanha" placeholder="Ex: SANTAFE" autocapitalize="characters" style="text-transform: uppercase;">
                </div>

                <div id="campo-nomechar" class="input-group hidden">
                    <label>Nome do Personagem</label>
                    <input type="text" id="j-nomechar" placeholder="Nome do seu personagem">
                </div>

                <button onclick="entrarJogador()" id="btn-jogador" class="btn-entrar">Atravessar</button>
                <div class="status-msg" id="status-jogador"></div>
            </div>

            <!-- ========== PAINEL MESTRE ========== -->
            <div id="panel-mestre" class="hidden">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="m-email" placeholder="seu@email.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="m-senha" placeholder="••••••••" autocomplete="current-password"
                           onkeydown="if(event.key==='Enter') entrarMestre()">
                </div>
                <button onclick="entrarMestre()" id="btn-mestre" class="btn-entrar">Acessar Painel</button>
                <div class="status-msg" id="status-mestre"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAzDHaOYApynTHqdvhWy4FhUvwLXr5zfuc",
        authDomain: "ciclo-vittae.firebaseapp.com",
        projectId: "ciclo-vittae",
        storageBucket: "ciclo-vittae.firebasestorage.app",
        messagingSenderId: "595476111730",
        appId: "1:595476111730:web:a04d2d53f3d5f9c902fdeb"
    };

    const MASTER_UID = 'ZvOjB4QG4WejkBgUg60qLRIpNZB3';

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Tema
    (function aplicarTemaSalvo() {
        const salvo = localStorage.getItem('ciclo_tema');
        if (salvo === 'dark') document.body.classList.add('dark');
        else if (salvo === 'light') document.body.classList.remove('dark');
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.body.classList.add('dark');
        atualizarIconeTema();
    })();
    function atualizarIconeTema() {
        const i = document.getElementById('theme-icon');
        if (i) i.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
    }
    window.toggleTheme = () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('ciclo_tema', document.body.classList.contains('dark') ? 'dark' : 'light');
        atualizarIconeTema();
    };

    // Abas
    window.setTab = (t) => {
        document.getElementById('tab-jogador').classList.toggle('active', t === 'jogador');
        document.getElementById('tab-mestre').classList.toggle('active', t === 'mestre');
        document.getElementById('panel-jogador').classList.toggle('hidden', t !== 'jogador');
        document.getElementById('panel-mestre').classList.toggle('hidden', t !== 'mestre');
        limparStatus();
    };
    window.setSubTab = (t) => {
        document.getElementById('sub-entrar').classList.toggle('active', t === 'entrar');
        document.getElementById('sub-criar').classList.toggle('active', t === 'criar');
        document.getElementById('campo-nomechar').classList.toggle('hidden', t !== 'criar');
        limparStatus();
    };

    function limparStatus() {
        ['status-jogador', 'status-mestre'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.innerText = ''; el.className = 'status-msg'; }
        });
    }

    function setStatus(id, msg, tipo = 'erro') {
        const el = document.getElementById(id);
        if (!el) return;
        el.innerText = msg;
        el.className = 'status-msg ' + tipo;
    }

    function marcarErro(inputEl) {
        inputEl.classList.add('erro');
        setTimeout(() => inputEl.classList.remove('erro'), 500);
    }

    function slugCampanha(s) {
        return String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/[^A-Z0-9_-]/g, '');
    }

    // ============ JOGADOR ============
    window.entrarJogador = async () => {
        const email = document.getElementById('j-email').value.trim();
        const senha = document.getElementById('j-senha').value;
        const campanha = slugCampanha(document.getElementById('j-campanha').value);
        const nomeChar = document.getElementById('j-nomechar').value.trim();
        const modoCriar = document.getElementById('sub-criar').classList.contains('active');

        if (!email) return marcarErro(document.getElementById('j-email')), setStatus('status-jogador', 'Informe o email.');
        if (!senha) return marcarErro(document.getElementById('j-senha')), setStatus('status-jogador', 'Informe a senha.');
        if (!campanha) return marcarErro(document.getElementById('j-campanha')), setStatus('status-jogador', 'Informe o código da campanha.');
        if (modoCriar && !nomeChar) return marcarErro(document.getElementById('j-nomechar')), setStatus('status-jogador', 'Informe o nome do personagem.');

        const btn = document.getElementById('btn-jogador');
        btn.disabled = true; btn.innerText = 'Tecendo o Véu...';
        setStatus('status-jogador', '');

        try {
            // 1) Autentica ou cria conta
            let user;
            if (modoCriar) {
                try {
                    const cred = await createUserWithEmailAndPassword(auth, email, senha);
                    user = cred.user;
                } catch (e) {
                    if (e.code === 'auth/email-already-in-use') {
                        // já tem conta, tenta login normal
                        const cred = await signInWithEmailAndPassword(auth, email, senha);
                        user = cred.user;
                    } else throw e;
                }
            } else {
                const cred = await signInWithEmailAndPassword(auth, email, senha);
                user = cred.user;
            }

            // 2) Verifica se a campanha existe
            const campSnap = await getDoc(doc(db, 'campanhas', campanha));
            if (!campSnap.exists()) {
                await signOut(auth);
                throw new Error('Campanha "' + campanha + '" não existe. Confira o código com o mestre.');
            }

            // 3) Ficha do jogador = campanha__uid
            const charId = `${campanha}__${user.uid}`;
            const charRef = doc(db, 'personagens', charId);
            const charSnap = await getDoc(charRef);

            if (charSnap.exists()) {
                // Ficha já existe → só entra
                localStorage.setItem('ciclo_campanha', campanha);
                localStorage.setItem('ciclo_char_id', charId);
                setStatus('status-jogador', 'Alma reconhecida.', 'sucesso');
                setTimeout(() => { window.location.href = `ficha.html?char=${encodeURIComponent(charId)}`; }, 400);
                return;
            }

            // Não existe ainda → precisa do nome do personagem
            if (!nomeChar) {
                await signOut(auth);
                setSubTab('criar');
                marcarErro(document.getElementById('j-nomechar'));
                throw new Error('Você ainda não tem ficha nessa campanha. Informe o nome do personagem para criá-la.');
            }

            // Cria ficha zerada
            await setDoc(charRef, getDefaultData(nomeChar, campanha, user.uid));
            localStorage.setItem('ciclo_campanha', campanha);
            localStorage.setItem('ciclo_char_id', charId);
            setStatus('status-jogador', 'Nova alma registrada.', 'sucesso');
            setTimeout(() => { window.location.href = `ficha.html?char=${encodeURIComponent(charId)}`; }, 500);

        } catch (e) {
            btn.disabled = false; btn.innerText = 'Atravessar';
            const msg = traduzirErro(e);
            setStatus('status-jogador', msg);
            console.error(e);
        }
    };

    // ============ MESTRE ============
    window.entrarMestre = async () => {
        const email = document.getElementById('m-email').value.trim();
        const senha = document.getElementById('m-senha').value;
        if (!email) return marcarErro(document.getElementById('m-email')), setStatus('status-mestre', 'Informe o email.');
        if (!senha) return marcarErro(document.getElementById('m-senha')), setStatus('status-mestre', 'Informe a senha.');

        const btn = document.getElementById('btn-mestre');
        btn.disabled = true; btn.innerText = 'Abrindo o Véu...';
        setStatus('status-mestre', '');

        try {
            const cred = await signInWithEmailAndPassword(auth, email, senha);
            if (cred.user.uid !== MASTER_UID) {
                await signOut(auth);
                throw new Error('Essa conta não é de mestre.');
            }
            setStatus('status-mestre', 'Bem-vindo, mestre.', 'sucesso');
            setTimeout(() => { window.location.href = 'mestre.html'; }, 400);
        } catch (e) {
            btn.disabled = false; btn.innerText = 'Acessar Painel';
            setStatus('status-mestre', traduzirErro(e));
            console.error(e);
        }
    };

    function traduzirErro(e) {
        const code = e.code || '';
        const mapa = {
            'auth/invalid-credential': 'Email ou senha incorretos.',
            'auth/wrong-password': 'Senha incorreta.',
            'auth/user-not-found': 'Conta não encontrada. Use "Criar Conta".',
            'auth/invalid-email': 'Email inválido.',
            'auth/weak-password': 'Senha muito curta (mínimo 6 caracteres).',
            'auth/email-already-in-use': 'Esse email já está em uso.',
            'auth/too-many-requests': 'Muitas tentativas. Espere um pouco.'
        };
        return mapa[code] || e.message || 'Erro desconhecido.';
    }

    // Ficha padrão — alinhada com o getDefaultData do ficha.html
    function getDefaultData(nomeChar, campanha, uid) {
        const skills = ["Acrobacia","Adestramento","Atletismo","Atuação","Cura","Diplomacia","Enganação","Fortitude","Furtividade","Iniciativa","Intimidação","Intuição","Investigação","Ladinagem","Luta","Misticismo","Percepção","Pilotagem","Pontaria","Reflexos","Religião","Sobrevivência","Vontade"];
        return {
            campanhaId: campanha,
            donoUid: uid,
            estado: 'vivo',
            info: { nome: nomeChar, player: '', profissao: '', idade: '', altura: '', avatarURL: '' },
            status: {
                Vida: { a: 10, m: 10 },
                Opacidade: { a: 100, m: 100 },
                Sanidade: { a: 10, m: 10 },
                Metafísica: { a: 5, m: 5 }
            },
            atributos: { Vitalidade: 1, Projeção: 1, Conhecimento: 1, Encantamento: 1, Influencia: 1, Espiritualidade: 0 },
            defesaBonus: 0,
            pericias: skills.reduce((acc, s) => { acc[s] = { b: 0, t: false }; return acc; }, {}),
            combate: [], inventario: [], poderes: [],
            anotacoes: '', diario: [],
            emocaoVida: '', emocaoSanidade: 'Medo',
            emocoes: {
                Alegria: { nivel: 0 }, Tristeza: { nivel: 0 }, Medo: { nivel: 0 },
                Raiva: { nivel: 0 }, Nojo: { nivel: 0 }, Surpresa: { nivel: 0 }
            },
            criadoEm: serverTimestamp()
        };
    }

    // Se o usuário já está logado, tenta redirecionar direto
    onAuthStateChanged(auth, async (user) => {
        if (!user) return;
        // Mestre?
        if (user.uid === MASTER_UID) {
            // Só redireciona se ele clicou em mestre (para não atrapalhar quem abre a ficha)
            return;
        }
        // Jogador: se tem char_id em localStorage, oferece atalho
        const charId = localStorage.getItem('ciclo_char_id');
        if (charId) {
            const snap = await getDoc(doc(db, 'personagens', charId));
            if (snap.exists()) {
                // atualiza se o uid confere
                const data = snap.data();
                if (data.donoUid === user.uid) {
                    // Opcional: auto-redirect. Deixei comentado pra não surpreender.
                    // window.location.href = `ficha.html?char=${encodeURIComponent(charId)}`;
                }
            }
        }
    });

    // Enter nos campos
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const active = document.activeElement;
        if (!active) return;
        if (active.closest('#panel-jogador')) entrarJogador();
        if (active.closest('#panel-mestre')) entrarMestre();
    });
</script>
</body>
</html>
